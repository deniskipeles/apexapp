name: Build Cross-Platform Bundles

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  # ============================================================================
  # 1. WINDOWS & LINUX BUILDS (Runs on Ubuntu in parallel)
  # ============================================================================
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Modern Windows (10/11) ---
          - name: windows-10-11
            script: setup_and_build_win10_11.sh
            artifact_name: apexapp-windows-10-11-installer
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            cache_xwin: true

          # --- Windows 7 (Offline Fixed WebView2) ---
          - name: windows-7
            script: setup_and_build_win7.sh
            artifact_name: apexapp-windows-7-installer
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            cache_xwin: true

          # --- Linux x86_64 ---
          - name: linux-x86_64
            script: setup_and_build_apexapp-x86_64-unknown-linux-musl.sh
            artifact_name: apexapp-linux-x86_64
            artifact_path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            cache_xwin: false

          # --- Linux ARM64 ---
          - name: linux-arm64
            script: setup_and_build_apexapp-aarch64-unknown-linux-musl.sh
            artifact_name: apexapp-linux-arm64
            artifact_path: |
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              # src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            cache_xwin: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Rust Toolchain & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-cargo-

      # Cache the Windows SDK download (xwin) only for Windows jobs
      - name: Cache XWin SDK
        if: matrix.cache_xwin
        id: cache-xwin
        uses: actions/cache@v4
        with:
          path: ./xwin
          key: ${{ runner.os }}-xwin-sdk

      # - name: Setup QEMU for ARM64 Execution
      #   if: matrix.name == 'linux-arm64'
      #   uses: docker/setup-qemu-action@v3

      - name: Make Script Executable & Run Build
        run: |
          chmod +x ${{ matrix.script }}
          ./${{ matrix.script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7
          if-no-files-found: error

  # ============================================================================
  # 2. MACOS BUILDS (Runs on native Apple Silicon runner in parallel)
  # ============================================================================
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Apple Silicon (M1/M2/M3/M4) ---
          - target: aarch64-apple-darwin
            script: setup_and_build_apexapp-aarch64-apple-darwin.sh
            artifact_name: apexapp-macos-arm64

          # --- Intel Mac ---
          - target: x86_64-apple-darwin
            script: setup_and_build_apexapp-x86_64-apple-darwin.sh
            artifact_name: apexapp-macos-intel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Make Script Executable & Run Build
        run: |
          chmod +x ${{ matrix.script }}
          ./${{ matrix.script }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error